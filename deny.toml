# cargo-deny policy — FerriScan
# Enforced in CI: `cargo deny check`

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
# All entries are "unmaintained" notices (not vulnerabilities) for transitive GPUI dependencies we
# cannot replace (ADR-0005). Re-check on every GPUI revision bump and remove when fixed upstream.
ignore = [
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; text shaping inside GPUI" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; font parsing inside GPUI" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; Linux D-Bus stack of GPUI" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; Linux D-Bus stack of GPUI" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; Linux D-Bus stack of GPUI" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
]
# Copyleft licenses are rejected: FerriScan is MIT and must stay redistributable
# under permissive terms on every platform.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path without a version.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # No network stack in v1.0 (ADR-0004). Dev-dependencies are exempt by policy review,
  # not by configuration: adding any of these to a non-dev dependency fails review.
  { name = "reqwest" },
  { name = "hyper" },
  { name = "ureq" },
  # Shell execution helpers: all external programs use explicit argv.
  { name = "shell-escape" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# GPUI is only available from the Zed repository (ADR-0005); keep the allowance to this one org.
allow-git = [
  "https://github.com/zed-industries/zed",
  "https://github.com/zed-industries/oo7", # Zed fork pulled in by GPUI on Linux
]
