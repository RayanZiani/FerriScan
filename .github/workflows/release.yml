name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev
      # Plain release binary for now. Installers and code signing return with M10 (release
      # engineering); the Tauri bundler and its signing secrets are gone.
      - run: cargo build --release -p ferriscan-app -p ferriscan-cli --target ${{ matrix.target }}
      - name: Package and checksum
        shell: bash
        run: |
          mkdir -p dist
          find target/${{ matrix.target }}/release -maxdepth 1 -type f \
            \( -name 'ferriscan-app*' -o -name 'ferriscan' -o -name 'ferriscan.exe' \) \
            ! -name '*.d' ! -name '*.pdb' -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ferriscan-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Extract release notes from CHANGELOG
        run: |
          awk '/^## \[/{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
          draft: true
