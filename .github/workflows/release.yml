name: release

# Windows only for now. Linux and macOS builds are deferred until their GPUI setup is verified.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.3.0)
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: build and package (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ferriscan-app -p ferriscan-cli
      - name: Install installer toolchains
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Build installers and checksums
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          ./scripts/build-installers.ps1 -Exe target/release/ferriscan-app.exe
          Copy-Item target/release/ferriscan.exe dist/ferriscan-cli.exe
          # Checksums again so the CLI is covered too.
          Push-Location dist
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: ferriscan-windows
          path: dist/*

  publish:
    name: publish GitHub release
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Extract release notes from CHANGELOG
        run: |
          awk '/^## \[/{c++} c==2' CHANGELOG.md > RELEASE_NOTES.md || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
          draft: true
