name: nightly

on:
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

jobs:
  bench:
    name: benchmarks + budget gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo xtask fixtures --size 1m
      - run: cargo bench -p ferriscan-core -- --save-baseline nightly
      - run: cargo xtask budget
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: criterion
          path: target/criterion

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: npm --prefix apps/desktop ci
      - run: cargo xtask fixtures --size e2e
      - run: npm --prefix apps/desktop run test:e2e
        env:
          DISPLAY: ":99"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: apps/desktop/test-results
