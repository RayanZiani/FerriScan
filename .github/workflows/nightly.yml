name: nightly

on:
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

jobs:
  bench:
    name: benchmarks + budget gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev
      - run: cargo xtask fixtures --size 1m
      - run: cargo bench -p ferriscan-core -- --save-baseline nightly
      - run: cargo xtask budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion
          path: target/criterion
