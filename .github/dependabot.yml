version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      windows-sys:
        patterns: ["windows*"]
      dev-deps:
        dependency-type: development
        patterns: ["proptest*", "criterion*", "insta*", "tempfile*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
