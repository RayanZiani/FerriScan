[workspace]
exclude = ["apps/desktop-gpui"]
resolver = "3"
members = [
  "crates/ferriscan-core",
  "crates/ferriscan-platform",
  "crates/ferriscan-actions",
  "crates/ferriscan-persist",
  "crates/ferriscan-i18n",
  "crates/ferriscan-cli",
  "apps/desktop/src-tauri",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/ferriscan/ferriscan"
authors = ["FerriScan contributors"]

[workspace.dependencies]
ferriscan-core = { path = "crates/ferriscan-core" }
ferriscan-platform = { path = "crates/ferriscan-platform" }
ferriscan-persist = { path = "crates/ferriscan-persist" }
ferriscan-i18n = { path = "crates/ferriscan-i18n" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
globset = "0.4.16"
smallvec = "1.15"
rustc-hash = "2.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
module_inception = "allow"
implicit_hasher = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1
